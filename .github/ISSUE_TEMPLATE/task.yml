name: 任务
description: 一件会被 PR 关掉的活
body:
  - type: markdown
    attributes:
      value: |
        不确定该找谁就把名单留空 —— 仓库的协调者会读票、必要时追问,补齐规格再派人。

        需求文档、设计稿、代码规范**不进票**:它们住在仓库里,agent 开工时自己读。
  - type: textarea
    id: roster
    attributes:
      label: 名单
      description: 这张票要经过哪几个角色。不确定就留空
      render: yaml
      value: |
        ---
        role:
        assist: []
        ---
  - type: textarea
    id: scope
    attributes:
      label: 本次范围
      description: 这次要做什么。散文即可,不用结构化
      value: |
        <!-- 名单为空:补齐范围与验收标准后打 role:<id>,信息不足则打 needs-info -->
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 验收标准
      description: 怎么算做完了
    validations:
      required: true
